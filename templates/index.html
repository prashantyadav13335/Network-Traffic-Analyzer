<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network Traffic Analyzer — Live Dashboard</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        margin: 0;
        padding: 30px;
    }
    h1 {
        color: #58a6ff;
        margin-bottom: 5px;
    }
    .subtitle {
        color: #8b949e;
        margin-bottom: 25px;
    }
    .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        background: #238636;
        color: white;
        font-size: 13px;
        margin-bottom: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #161b22;
        border-radius: 8px;
        overflow: hidden;
    }
    th, td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #21262d;
    }
    th {
        background: #21262d;
        color: #58a6ff;
        font-size: 13px;
        text-transform: uppercase;
    }
    tr.portscan { border-left: 4px solid #f85149; }
    tr.bruteforce { border-left: 4px solid #d29922; }
    .badge {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
    }
    .badge.Port-Scan { background: #f85149; color: white; }
    .badge.Brute-Force { background: #d29922; color: black; }
    .empty {
        color: #8b949e;
        text-align: center;
        padding: 40px;
    }
</style>
</head>
<body>
    <h1>🛡️ Network Traffic Analyzer</h1>
    <div class="subtitle">Live malicious pattern detection dashboard</div>
    <div class="status" id="status">● Monitoring active</div>

    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Type</th>
                <th>Source IP</th>
                <th>Target</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody id="alerts-body">
            <tr><td colspan="5" class="empty">No alerts yet — waiting for traffic...</td></tr>
        </tbody>
    </table>

<script>
async function fetchAlerts() {
    try {
        const res = await fetch('/api/alerts');
        const alerts = await res.json();
        const body = document.getElementById('alerts-body');

        if (alerts.length === 0) {
            body.innerHTML = '<tr><td colspan="5" class="empty">No alerts yet — waiting for traffic...</td></tr>';
            return;
        }

        body.innerHTML = alerts.map(a => {
            const cls = a.type === 'Port Scan' ? 'portscan' : 'bruteforce';
            const badgeCls = a.type.replace(' ', '-');
            return `<tr class="${cls}">
                <td>${a.time}</td>
                <td><span class="badge ${badgeCls}">${a.type}</span></td>
                <td>${a.source_ip}</td>
                <td>${a.target}</td>
                <td>${a.detail}</td>
            </tr>`;
        }).join('');
    } catch (e) {
        document.getElementById('status').textContent = '● Connection lost';
        document.getElementById('status').style.background = '#f85149';
    }
}

fetchAlerts();
setInterval(fetchAlerts, 2000); // har 2 second mein refresh
</script>
</body>
</html>
